services:
  db:
    image: postgres:15-alpine
    container_name: nasa_reviewer_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nasadb
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nasadb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nasa_reviewer_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./README.md:/docs/README.md
      - ./USER_GUIDE.md:/docs/USER_GUIDE.md
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/nasadb
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: nasa_reviewer_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
