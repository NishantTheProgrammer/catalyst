services:
  backend:
    build: ./backend
    container_name: nasa_reviewer_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./README.md:/docs/README.md
      - ./USER_GUIDE.md:/docs/USER_GUIDE.md
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=sqlite:////data/nasa.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: nasa_reviewer_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
